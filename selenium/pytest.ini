[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
rp_endpoint = http://localhost:9090/api/v1
rp_project = AuraZone
rp_launch = AuraZone Selenium Tests
rp_launch_attributes = 'framework:selenium' 'runner:pytest' 'suite:e2e' 'app:aurazone' 'team:qa' 'env:qa'
rp_launch_description = Selenium automation execution
rp_log_level = INFO
markers =
    customer: Tests for the customer-facing storefront
    admin: Tests for the admin panel
    critical: High-priority tests that must pass
    slow: Tests that take a long time (concurrency/edge cases)
    requires_admin: Skip if ADMIN_EMAIL/ADMIN_PASSWORD are not set
    requires_customer: Skip if CUSTOMER_EMAIL/CUSTOMER_PASSWORD are not set
log_cli = true
log_cli_level = INFO
